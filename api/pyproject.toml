[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "sqlalchemy>=2.0",
]

[tool.fastapi]
    entrypoint = "main:app"

dependencies = [
    "fastapi[standard]>=0.140.1",
    "psycopg>=3.3.4",
    "uvicorn>=0.51.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
