services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 3s
      retries: 15
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://relay:relay@db:5432/relay
      PYTHONUNBUFFERED: "1"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql://relay:relay@db:5432/relay
      PYTHONUNBUFFERED: "1"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
  seed:
    image: postgres:16
    profiles: ["seed"]
    environment:
      PGPASSWORD: relay
    volumes:
      - ./db/seed.sql:/seed.sql:ro
    entrypoint: ["psql", "-h", "db", "-U", "relay", "-d", "relay", "-f", "/seed.sql"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]
