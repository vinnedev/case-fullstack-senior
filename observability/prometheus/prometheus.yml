global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  # DNS discovery: o Docker devolve o IP de cada réplica do serviço, então
  # `docker compose up --scale worker=N` entra no scrape automaticamente.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
    relabel_configs:
      - target_label: service
        replacement: worker

  - job_name: postgres
    scrape_interval: 60s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: database

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: containers

  # Disponibilidade e latência vistas de fora (web e api)
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://web:5173
          - http://api:8000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
