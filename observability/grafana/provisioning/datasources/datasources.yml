apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: PostgresRelay
    uid: postgres-relay
    type: postgres
    access: proxy
    url: db:5432
    user: relay
    jsonData:
      database: relay
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: relay
